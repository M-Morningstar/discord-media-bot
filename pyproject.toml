[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-media-bot"
version = "1.0.0"
description = "Discord bot for adding movies and TV shows to Radarr/Sonarr via IMDB ID"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = ["discord", "radarr", "sonarr", "imdb", "media", "automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "discord.py>=2.3,<3",
    "aiohttp>=3.9,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5,<6",
    "pytest-mock>=3,<4",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "pre-commit>=3,<4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C4", "T20"]
ignore = ["T201"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    'ignore::DeprecationWarning:discord.player:',
]
